<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay Project</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <!-- flexbox container -->
        <div class="container">

            <!-- flexbox item -->
            <div id="header">
                <h2>Mebay</h2>
            </div>

            <!-- flexbox item -->
            <div id="sidebar">
                <div class="showcase-items">
                    <img src="images/Garchomp Pose1.webp" id="pose-1">
                    <img src="images/Garchomp Pose2.webp">
                    <img src="images/Garchomp Pose3.webp">
                    <img src="images/Garchomp Pose4.webp">
                </div>
            </div>

            <!-- flexbow item -->
             <div id="main-content">
                <div class="main-item">
                <img src="images/Garchomp Main Item.png" id="main-pose">
                </div>
             </div>
             <div id="shop-content">
                <div class="product-name">
                    <h2>Pokemon Funism - Garchomp Anime Brand
                        <br>New Premium Figure Display</h2>
                </div>
                <div class="user-profile">
                    <img src="images/profile picture.png" id="profile-image">
                    <h4>amarismith</h4>
                </div>
                <div class="product-price">
                    <h2>US $39.95/ea</h2>
                </div>
                <p>
                    Condition: <b>New</b> 
                </p>
                <p>
                    Quantity: <span id="quantity-number">
                        <span>1</span>
                </p>
                <div class="buy-now-button">
                <h4>Buy It Now</h4>
                </div>
            </div>
        </div>                          
    </body>
</html>
